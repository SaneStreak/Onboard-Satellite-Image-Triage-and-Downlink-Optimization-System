name: onboard-triage
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Core CV & Geospatial (conda-forge builds rasterio + gdal cleanly)
  - rasterio>=1.3.0
  - pillow>=10.0.0
  - opencv
  - imagecodecs
  # PyTorch & Accelerators
  - pytorch>=2.2.0
  - torchvision>=0.17.0
  - cpuonly  # Replace with 'pytorch-cuda=12.1' if training locally on an NVIDIA GPU
  # Simulation & Scientific Stack
  - numpy>=1.26.0
  - scipy>=1.12.0
  - pandas>=2.2.0
  - pyyaml>=6.0
  - tqdm>=4.66.0
  - pytest>=8.0.0
  # Pip-specific packages (not strictly isolated in conda channels)
  - pip
  - pip:
      - onnx>=1.15.0
      - onnxruntime>=1.17.0
      - simpy>=4.1.0
      - kaggle